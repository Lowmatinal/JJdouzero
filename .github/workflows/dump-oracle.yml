# 在 GitHub Actions 里用官方 PerfectDou 编码器导出 ground truth。
# 官方 encode.cpython-37m-x86_64-linux-gnu.so 是 Linux + CPython 3.7 ABI，
# Windows 载不进；这里用 container: python:3.7 拿到 100% 保真的 obs。
name: dump-perfectdou-oracle

on:
  workflow_dispatch:
    inputs:
      games:
        description: "随机对局数（总决策点上限固定 2000，60 局约可采满）"
        required: false
        default: "80"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dump-oracle.yml"
      - "tools/pd_dump_oracle.py"

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-22.04
    container:
      image: python:3.7          # .so 是 cpython-37m，必须精确 3.7
    timeout-minutes: 20

    steps:
      - name: 取本仓库（含 pd_dump_oracle.py）
        uses: actions/checkout@v4

      - name: 取官方 PerfectDou 仓库（tarball，不依赖容器里有没有 git）
        run: |
          python - <<'PY'
          import io, os, tarfile, urllib.request
          url = ("https://codeload.github.com/"
                 "Netease-Games-AI-Lab-Guangzhou/PerfectDou/"
                 "tar.gz/refs/heads/main")
          req = urllib.request.Request(url, headers={"User-Agent": "pd-oracle-dump"})
          data = urllib.request.urlopen(req, timeout=120).read()
          print("tarball:", len(data), "bytes")
          with tarfile.open(fileobj=io.BytesIO(data)) as tf:
              tf.extractall("/tmp/pd")
          root = "/tmp/pd/PerfectDou-main"
          for rel in ("libCalculateLeftHands.so",
                      "perfectdou/env/encode.cpython-37m-x86_64-linux-gnu.so",
                      "perfectdou/env/game.py",
                      "perfectdou/env/move_generator.py"):
              p = os.path.join(root, rel)
              assert os.path.isfile(p), "missing " + rel
              print("%9d  %s" % (os.path.getsize(p), rel))
          PY
          chmod +x /tmp/pd/PerfectDou-main/libCalculateLeftHands.so
          chmod +x /tmp/pd/PerfectDou-main/perfectdou/env/*.so

      - name: 装 numpy（py3.7 的兼容上限是 1.21.x）
        run: |
          python -c "import sys; assert sys.version_info[:2]==(3,7), sys.version; print(sys.version)"
          python -m pip install -q "numpy<1.22"
          python -c "import numpy; print('numpy', numpy.__version__)"

      # 官方 .so 内部 ctypes.CDLL("./libCalculateLeftHands.so")，按 CWD 找，
      # 所以这一步和下一步的 working-directory 必须是官方仓库根目录。
      - name: 自检：加载的确实是官方 .so，且依赖库能 dlopen
        working-directory: /tmp/pd/PerfectDou-main
        run: |
          ldd ./libCalculateLeftHands.so || true
          python - <<'PY'
          import ctypes, os, sys
          print("CWD:", os.getcwd())
          lib = ctypes.CDLL("./libCalculateLeftHands.so")
          print("libCalculateLeftHands.so loaded:", lib._name)
          sys.path.insert(0, ".")
          import perfectdou.env.encode as e
          print("encoder:", e.__file__)
          assert e.__file__.endswith(".so"), "loaded a .py instead of the official .so"
          for fn in ("encode_obs_landlord", "encode_obs_peasant"):
              assert hasattr(e, fn), "missing " + fn
              print("  ok", fn)
          from perfectdou.env.game import GameEnv
          print("GameEnv ok")
          PY

      - name: 导出 oracle
        working-directory: /tmp/pd/PerfectDou-main
        run: |
          python "$GITHUB_WORKSPACE/tools/pd_dump_oracle.py" \
            --repo . \
            --games "${{ github.event.inputs.games || '80' }}" \
            --max-items 2000 \
            --out "$GITHUB_WORKSPACE/oracle.pkl.gz"
          ls -lh "$GITHUB_WORKSPACE/oracle.pkl.gz"

      - name: 上传 oracle 作为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pd-oracle
          path: oracle.pkl.gz
          if-no-files-found: error
          retention-days: 30

      - name: 失败时的排查提示
        if: failure()
        run: |
          echo "常见原因："
          echo "  1) 解释器不是 CPython 3.7（.so 是 cpython-37m ABI，3.8+ 直接 ModuleNotFoundError）"
          echo "  2) CWD 不是官方仓库根 => 找不到 ./libCalculateLeftHands.so"
          echo "  3) 官方仓库默认分支不叫 main => 改 tarball URL 里的 refs/heads/main"
          echo "  4) upload-artifact 在容器里找不到 node20 => 见 README 的备用 workflow"
